name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Validate Flyway migration names
        shell: pwsh
        run: ./scripts/check-migrations.ps1

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Test and package
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: mylog-openapi-v1
          path: backend/target/openapi/mylog-v1.json
          if-no-files-found: error

      - name: Build container image
        run: docker build -t mylog-backend:ci .

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: OWASP dependency scan
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Psecurity-checks dependency-check:check

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
