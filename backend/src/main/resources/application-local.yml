spring:
  datasource:
    url: ${MYLOG_DB_URL:jdbc:postgresql://localhost:5432/mylog}
    username: ${MYLOG_DB_USERNAME:mylog}
    password: ${MYLOG_DB_PASSWORD:mylog_local_only}
    hikari:
      maximum-pool-size: ${MYLOG_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${MYLOG_DB_POOL_MIN_IDLE:2}
  data:
    redis:
      url: ${MYLOG_REDIS_URL:redis://localhost:6379}

logging:
  level:
    com.mylog: DEBUG
