spring:
  mail:
    host: ${MYLOG_MAIL_HOST:localhost}
    port: ${MYLOG_MAIL_PORT:1025}
    username: ${MYLOG_MAIL_USERNAME:}
    password: ${MYLOG_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MYLOG_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MYLOG_MAIL_STARTTLS_ENABLED:false}
      mail.smtp.starttls.required: ${MYLOG_MAIL_STARTTLS_ENABLED:false}
  datasource:
    url: ${MYLOG_DB_URL:jdbc:postgresql://localhost:5432/mylog}
    username: ${MYLOG_DB_USERNAME:mylog}
    password: ${MYLOG_DB_PASSWORD:mylog_local_only}
    hikari:
      maximum-pool-size: ${MYLOG_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${MYLOG_DB_POOL_MIN_IDLE:2}
  data:
    redis:
      url: ${MYLOG_REDIS_URL:redis://localhost:6379}
      ssl:
        enabled: ${MYLOG_REDIS_SSL_ENABLED:false}

logging:
  level:
    com.mylog: DEBUG

mylog:
  identity:
    enabled: true
    # Local only: every local browser/test run shares 127.0.0.1, so raise the per-IP reset limits.
    # Per-email limits keep their production values (they protect the 8-digit code).
    password-reset:
      requests-per-ip: ${MYLOG_PASSWORD_RESET_REQUESTS_PER_IP:100}
      confirms-per-ip: ${MYLOG_PASSWORD_RESET_CONFIRMS_PER_IP:100}
    oauth:
      google:
        enabled: ${MYLOG_GOOGLE_OAUTH_ENABLED:true}
  open-api:
    enabled: ${MYLOG_OPENAPI_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${MYLOG_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${MYLOG_SWAGGER_UI_ENABLED:true}
