spring:
  application:
    name: mylog-backend
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:mylog}
    password: ${RABBITMQ_PASSWORD:mylog_local_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 8
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: MyLog backend service
    version: '@project.version@'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

mylog:
  statistics:
    consumer-enabled: ${STATISTICS_CONSUMER_ENABLED:true}
  insight:
    consumer-enabled: ${INSIGHT_CONSUMER_ENABLED:true}
    lookback-days: ${INSIGHT_LOOKBACK_DAYS:30}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    endpoint: ${AI_ENDPOINT:https://api.openai.com/v1/responses}
    model: ${AI_MODEL:gpt-5-mini}
    prompt-version: ${AI_PROMPT_VERSION:analysis-v1}
    schema-version: ${AI_SCHEMA_VERSION:1.0}
    consumer-enabled: ${AI_CONSUMER_ENABLED:true}
    scheduling-enabled: ${AI_SCHEDULING_ENABLED:true}
    batch-size: ${AI_JOB_BATCH_SIZE:8}
    max-attempts: ${AI_JOB_MAX_ATTEMPTS:4}
    poll-interval: ${AI_JOB_POLL_INTERVAL:1s}
    claim-lease: ${AI_JOB_CLAIM_LEASE:2m}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    response-timeout: ${AI_RESPONSE_TIMEOUT:30s}
    retry-base-delay: ${AI_RETRY_BASE_DELAY:5s}
    retry-max-delay: ${AI_RETRY_MAX_DELAY:5m}
    circuit-failure-threshold: ${AI_CIRCUIT_FAILURE_THRESHOLD:5}
    circuit-open-duration: ${AI_CIRCUIT_OPEN_DURATION:30s}
    max-reflections: ${AI_MAX_REFLECTIONS:3}
  outbox:
    scheduling-enabled: ${OUTBOX_SCHEDULING_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
    claim-lease: ${OUTBOX_CLAIM_LEASE:30s}
    confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:5s}
    retry-base-delay: ${OUTBOX_RETRY_BASE_DELAY:2s}
    retry-max-delay: ${OUTBOX_RETRY_MAX_DELAY:5m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      issuer: ${JWT_ISSUER:mylog-backend}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
      signing-key-base64: ${JWT_SIGNING_KEY_BASE64}
    password:
      bcrypt-strength: ${BCRYPT_STRENGTH:12}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:mylog_refresh}
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Strict}
      path: /api/v1/auth
    policy:
      terms-version: ${TERMS_POLICY_VERSION:1.0}
      privacy-version: ${PRIVACY_POLICY_VERSION:1.0}
    rate-limit:
      key-prefix: ${RATE_LIMIT_KEY_PREFIX:mylog:rate:auth}
      window: ${AUTH_RATE_LIMIT_WINDOW:1m}
      register-attempts: ${REGISTER_RATE_LIMIT_ATTEMPTS:5}
      login-attempts: ${LOGIN_RATE_LIMIT_ATTEMPTS:10}
      refresh-attempts: ${REFRESH_RATE_LIMIT_ATTEMPTS:20}

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
  level:
    root: INFO
    com.mylog: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
