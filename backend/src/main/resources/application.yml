spring:
  application:
    name: mylog
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MYLOG_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mylog:
  app-profile: ${MYLOG_APP_PROFILE:all}
  web:
    allowed-origins: ${MYLOG_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.mylog: INFO
  pattern:
    correlation: "[traceId=%X{traceId:-} requestId=%X{requestId:-}] "
