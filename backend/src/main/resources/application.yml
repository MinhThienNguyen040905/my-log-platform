spring:
  application:
    name: mylog
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MYLOG_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState

mylog:
  app-profile: ${MYLOG_APP_PROFILE:all}
  jobs:
    enabled: ${MYLOG_JOBS_ENABLED:false}
    poll-delay-ms: ${MYLOG_JOBS_POLL_DELAY_MS:2000}
  ai:
    fake-enabled: ${MYLOG_AI_FAKE_ENABLED:false}
    provider: ${MYLOG_AI_PROVIDER:none}
    endpoint: ${MYLOG_AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    model: ${MYLOG_AI_MODEL:}
    api-key: ${MYLOG_AI_API_KEY:}
    timeout-ms: ${MYLOG_AI_TIMEOUT_MS:30000}
    input-usd-per-million: ${MYLOG_AI_INPUT_USD_PER_MILLION:0}
    output-usd-per-million: ${MYLOG_AI_OUTPUT_USD_PER_MILLION:0}
    provider-data-approved: ${MYLOG_AI_PROVIDER_DATA_APPROVED:false}
    output-safety-approved: ${MYLOG_AI_OUTPUT_SAFETY_APPROVED:false}
  safety:
    classifier:
      url: ${MYLOG_SAFETY_CLASSIFIER_URL:}
      token: ${MYLOG_SAFETY_CLASSIFIER_TOKEN:}
      timeout-ms: ${MYLOG_SAFETY_CLASSIFIER_TIMEOUT_MS:2000}
  insights:
    minimum-samples: ${MYLOG_INSIGHTS_MINIMUM_SAMPLES:7}
  reports:
    enabled: ${MYLOG_REPORTS_ENABLED:false}
    poll-delay-ms: ${MYLOG_REPORTS_POLL_DELAY_MS:5000}
    schedule-delay-ms: ${MYLOG_REPORTS_SCHEDULE_DELAY_MS:3600000}
  exports:
    enabled: ${MYLOG_EXPORTS_ENABLED:true}
    poll-delay-ms: ${MYLOG_EXPORTS_POLL_DELAY_MS:5000}
  deletion:
    enabled: ${MYLOG_DELETION_ENABLED:true}
    poll-delay-ms: ${MYLOG_DELETION_POLL_DELAY_MS:5000}
  feedback:
    retention-delay-ms: ${MYLOG_FEEDBACK_RETENTION_DELAY_MS:86400000}
  identity:
    enabled: false
  web:
    allowed-origins: ${MYLOG_ALLOWED_ORIGINS:http://localhost:3000}
  open-api:
    enabled: ${MYLOG_OPENAPI_ENABLED:false}
  cloudinary:
    enabled: ${MYLOG_CLOUDINARY_ENABLED:false}
    cloud-name: ${MYLOG_CLOUDINARY_CLOUD_NAME:}
    api-key: ${MYLOG_CLOUDINARY_API_KEY:}
    api-secret: ${MYLOG_CLOUDINARY_API_SECRET:}
    folder: ${MYLOG_CLOUDINARY_FOLDER:mylog}

springdoc:
  api-docs:
    enabled: ${MYLOG_OPENAPI_ENABLED:false}
    path: /internal/openapi
  swagger-ui:
    enabled: ${MYLOG_SWAGGER_UI_ENABLED:false}
    path: /internal/swagger-ui
  show-actuator: false

logging:
  level:
    root: INFO
    com.mylog: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
  pattern:
    correlation: "[traceId=%X{traceId:-} requestId=%X{requestId:-}] "
