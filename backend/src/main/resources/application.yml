spring:
  application:
    name: mylog
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MYLOG_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

mylog:
  app-profile: ${MYLOG_APP_PROFILE:all}
  identity:
    enabled: false
  web:
    allowed-origins: ${MYLOG_ALLOWED_ORIGINS:http://localhost:3000}
  open-api:
    enabled: ${MYLOG_OPENAPI_ENABLED:false}
  cloudinary:
    enabled: ${MYLOG_CLOUDINARY_ENABLED:false}
    cloud-name: ${MYLOG_CLOUDINARY_CLOUD_NAME:}
    api-key: ${MYLOG_CLOUDINARY_API_KEY:}
    api-secret: ${MYLOG_CLOUDINARY_API_SECRET:}
    folder: ${MYLOG_CLOUDINARY_FOLDER:mylog}

springdoc:
  api-docs:
    enabled: ${MYLOG_OPENAPI_ENABLED:false}
    path: /internal/openapi
  swagger-ui:
    enabled: ${MYLOG_SWAGGER_UI_ENABLED:false}
    path: /internal/swagger-ui
  show-actuator: false

logging:
  level:
    root: INFO
    com.mylog: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: OFF
  pattern:
    correlation: "[traceId=%X{traceId:-} requestId=%X{requestId:-}] "
